[package]
name = "clip-flow"
version = "1.0.0"
description = "Modern, lightweight, keyboard-first cross-platform clipboard manager"
authors = ["anmingxing"]
edition = "2021"

[lib]
name = "clip_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
arboard = { version = "3.4", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }
